name: Deploy Static Content to Pages

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          path: main

#      - name: Checkout develop
#        uses: actions/checkout@v4
#        with:
#          ref: develop
#          path: develop

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          # Matches the pnpm that generated pnpm-lock.yaml (lockfileVersion 9).
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # package.json engines requires ^25.5.0 || >=22.12.0 — the previous
          # pin of 22.8.0 did not satisfy it.
          node-version: '24'

      - name: Clean install dependencies (Main)
        run: |
          rm -rf main/node_modules
          pnpm install --no-frozen-lockfile
        working-directory: main

#      - name: Clean install dependencies (Develop)
#        run: |
#          rm -rf develop/node_modules
#          pnpm install --no-frozen-lockfile
#        working-directory: develop

      - name: Build Main Production
        run: npm run build-github-main
        working-directory: main
        env:
          VITE_APP_TURN_USERNAME: ${{ secrets.VITE_APP_TURN_USERNAME }}
          VITE_APP_TURN_CREDENTIAL: ${{ secrets.VITE_APP_TURN_CREDENTIAL }}

#      - name: Build Develop Production
#        run: npm run build-github-develop
#        working-directory: develop
#        env:
#          VITE_APP_TURN_USERNAME: ${{ secrets.VITE_APP_TURN_USERNAME }}
#          VITE_APP_TURN_CREDENTIAL: ${{ secrets.VITE_APP_TURN_CREDENTIAL }}

      - name: Create Dist Folder
        run: mkdir dist

      - name: Copy Main Build
        run: cp -r main/dist/* dist/

      # #176: the cover vote page, a static page beside the game (/cover-vote/).
      - name: Copy Cover Vote
        run: cp -r main/cover-vote dist/cover-vote

#      - name: Copy Develop Build
#        run: cp -r develop/dist/* dist/develop/

      # Requires GitHub Pages to be enabled on the repo with the source set to
      # "GitHub Actions" (Settings → Pages). This action can create the site
      # itself via `enablement: true`, but that needs a PAT — the default
      # GITHUB_TOKEN is not permitted to enable Pages.
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5