<!DOCTYPE html>
<html lang="">
<head>
  <meta charset="UTF-8">
  <!-- YouTube Playables SDK - kept ONLY on the Playgama build, which IS the
       Playables submission (Playgama forwards that one archive to YouTube).
       Stripped everywhere else by vite.config.ts.

       Load-bearing twice over. YouTube's integration requirements say the SDK
       MUST load before any game code executes; and the Playgama Bridge's own
       `youtube` adapter polls for `window.ytgame` on a 100 ms interval with NO
       timeout, so without this tag `bridge.initialize()` never settles and
       Playables shows a blank screen with every other check green.

       IN <head>, AND FIRST, on purpose. Vite injects the entry bundle as a
       `<script type="module">` into the head at build time — so a tag placed
       down in <body> with the other portal SDKs loads AFTER the game's own
       code in document order, which is the thing the requirement forbids.
       A classic (non-module) script here is parser-blocking and modules are
       deferred regardless, so this is guaranteed to run first. -->
  <script src="https://www.youtube.com/game_api/v1"></script>
  <!-- Web Storage shim. MUST stay the first of OUR scripts and MUST stay a
       classic (non-module) tag: module scripts are deferred, so a shim installed
       from inside the module graph runs after the entry chunk's static imports.
       On YouTube Playables `window.localStorage` is NULL, and `main.ts` hands it
       straight to `new SaveManager(...)`, which binds its methods in the
       constructor — a blank screen before the splash clears. Ships on every
       build: sandboxed iframes and blocked-storage embeds fail the same way.
       Vite rewrites the path to `./js/storage-shim.js` under `--base=./`. -->
  <script src="/js/storage-shim.js"></script>
  <meta name="color-scheme" content="dark only">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <!-- CSP meta tag injected by vite.config.ts at build time -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a1224">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mega Droid">
  <meta name="description" content="Beam into machine-infested sectors as Flux, a pearl-white combat android with a plasma-lit visor. Explore, blast rogue robots with your charge cannon, loot chests, take on missions and upgrade your circuits.">
  <link rel="manifest" href="/manifest.json">
  <title>Mega Droid</title>
  <style>
      /* The splash paints before any JS runs, so its styles are inlined here.
         It is the same picture FLogoProgress.vue draws, at the same size in
         the same place, so the handover when Vue mounts moves nothing: Flux's
         visor head in its charged ring over the chrome MEGA / amber DROID
         wordmark (store-art/brand/logo.mjs), as ONE inline SVG of paths (no ids, no text, so no web font
         can reflow it before the bundled faces load), above the HP-style loading bar.
         Change one, change both: tests/ui/splashLogo.test.ts holds the two to
         the same markup and the same sizes. */
      body {
          margin: 0;
          background-color: #0a1224;
          outline: none;
      }

      #static-splash {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          background: radial-gradient(circle at 50% 40%, rgba(255, 167, 51, 0.16) 0%, rgba(255, 167, 51, 0) 32%), radial-gradient(circle at 50% 40%, #1d2f63 0%, #111d42 52%, #0a1224 100%);
          transition: opacity 0.4s ease-out;
      }

      #static-splash.hidden {
          opacity: 0;
          pointer-events: none;
      }

      .s-grid {
          position: absolute;
          inset: -64px 0 0 -64px;
          background-image: linear-gradient(rgba(120, 160, 230, 0.08) 2px, transparent 2px), linear-gradient(90deg, rgba(120, 160, 230, 0.08) 2px, transparent 2px);
          background-size: 64px 64px;
          animation: s-pan 6s linear infinite;
      }

      @keyframes s-pan { to { transform: translate3d(64px, 64px, 0); } }

      .s-card {
          position: relative;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: clamp(10px, 3vmin, 20px);
          width: min(84vw, 70vh, 420px);
      }

      /* The logo: the square lockup (Flux's rendered head over MEGA / DROID,
         store-art/brand/logo.mjs), never wider than its 256 px file (the 2x
         source covers high-density screens). */
      .s-logo {
          display: block;
          width: min(100%, 256px);
          aspect-ratio: 1;
          margin: 0;
      }

      /* The loading bar: Flux's HP bar, 28 cyan energy cells in a navy
         capsule. ONE stylesheet for every loader: these hp-* rules are
         global (this <style> stays in <head> after the splash div is
         removed), and FLogoProgress.vue and the mission beam
         (MissionLoading.vue) draw their bars with the same classes, so the
         three cannot drift and the hand-over swaps nothing. ONE fill scaled by transform, clipped by the cells
         mask, so it creeps on the COMPOSITOR from the first byte, before any
         script runs; the Vue loader continues from wherever it has got to. */
      .hp-bar {
          position: relative;
          width: 76%;
          height: clamp(16px, 3.4vmin, 24px);
          border: 3px solid #141a33;
          border-radius: 6px;
          background: #0b1433;
          box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
          box-sizing: border-box;
          flex: none;
      }
      .hp-cells, .hp-lit {
          position: absolute;
          inset: 3px;
          -webkit-mask-image: repeating-linear-gradient(90deg, #000 0, #000 calc((100% - 54px) / 28), transparent calc((100% - 54px) / 28), transparent calc((100% - 54px) / 28 + 2px));
          mask-image: repeating-linear-gradient(90deg, #000 0, #000 calc((100% - 54px) / 28), transparent calc((100% - 54px) / 28), transparent calc((100% - 54px) / 28 + 2px));
      }
      .hp-cells { background: rgba(255, 255, 255, 0.08); }
      .hp-lit { overflow: hidden; }
      .hp-fill {
          width: 100%;
          height: 100%;
          background: linear-gradient(#e8fdff 0%, #7ff4ff 45%, #1f9fd8 100%);
          transform-origin: left center;
          transform: scaleX(0);
          transition-property: transform;
          transition-timing-function: cubic-bezier(0.2, 0.7, 0.3, 1);
          will-change: transform;
      }
      /* Only the static copy creeps by keyframes; the Vue copy is driven by
         its inline transform + transition. */
      #static-splash .hp-fill {
          animation: s-creep 5s cubic-bezier(0.15, 0.7, 0.3, 1) forwards;
      }
      @keyframes s-creep {
          to { transform: scaleX(0.1); }
      }

      /* The loading mini-game (public/js/mini-game.js, #Mini1): hung BELOW
         the column, out of its flow, so the logo and the bar stay exactly
         where they were. On a short screen (a landscape phone) it joins the
         column instead, smaller, under a smaller logo, so the whole stack
         still fits; hidden only where there is truly no room.
         LoaderMiniGame.vue's .mini-game draws the same box. */
      .s-mini {
          position: absolute;
          top: 100%;
          left: 0;
          right: 0;
          display: block;
          width: 100%;
          height: clamp(56px, min(30vmin, 22vh), 176px);
          margin: clamp(10px, 3vmin, 20px) auto 0;
          touch-action: none;
          cursor: crosshair;
      }
      @media (max-height: 600px) {
          .s-logo { width: min(100%, 256px, 42vh); }
          .s-mini { position: static; margin: 0; }
      }
      @media (max-height: 240px) { .s-mini { display: none; } }

      @media (prefers-reduced-motion: reduce) {
          .s-grid { animation: none; }
          #static-splash .hp-fill { animation-duration: 0.01s; }
      }
  </style>
</head>
<body>
<div id="static-splash">
  <div class="s-grid" aria-hidden="true"></div>
  <div class="s-card">
    <img class="s-logo" src="/images/logo/mega-droid-logo-square-256.webp" srcset="/images/logo/mega-droid-logo-square-256.webp 1x, /images/logo/mega-droid-logo-square-512.png 2x, /images/logo/mega-droid-logo-square-768.webp 3x" alt="Mega Droid" width="256" height="256" decoding="async" fetchpriority="high">
    <div class="hp-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div class="hp-cells" aria-hidden="true"></div><div class="hp-lit" aria-hidden="true"><div class="hp-fill"></div></div></div>
    <canvas class="s-mini" aria-hidden="true"></canvas>
  </div>
</div>
<!-- The loading mini-game (public/js/mini-game.js). The build minifies it
     and INLINES it here, with its sha256 in the CSP (vite.config.miniGame.ts);
     only the Playgama / Playables build keeps it as a file. Before the portal
     SDK tags, so it is playing while they download; it starts itself on the
     canvas above. -->
<script src="/js/mini-game.js"></script>
<!-- Load the SDK before your game code -->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<!-- No Playgama Bridge tag: v2 is bundled from the @playgama/bridge npm package
     (src/utils/playgamaBridgeLoader.ts). The v1 CDN script fetched its adapter
     chunks from bridge.playgama.com at runtime and injected them as script tags,
     neither of which YouTube Playables allows — and Playgama QA rejects v1. -->
<!-- Load the SDK before your game code -->
<script src="https://integration.gamepix.com/sdk/v3/gamepix.sdk.js"></script>
<!-- Poki SDK - stripped for non-Poki builds by vite.config.ts -->
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
